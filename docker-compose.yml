services:

  # ─── FastAPI Application ────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi_app
    restart: unless-stopped
    ports:
      - "8007:8000"
    environment:
      - ENV=${ENV:-development}
      - MODEL_PATH=${MODEL_PATH:-/app/models}
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok_tunnel
    restart: unless-stopped
    command:
      - "http"
      - "api:8000"        
      - "--log=stdout"
    environment:
      - NGROK_AUTHTOKEN=3CYCoqthKel97RPqhohZDn5YmSm_2ju6X8WUTWKXnuLnvbvku
    ports:
      - "4040:4040"                
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app_network

networks:
  app_network:
    driver: bridge